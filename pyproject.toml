[project]
name = "activipyinfo"
dynamic = ["version"]
description = "Python client for the ActivityInfo API: databases, users, forms, records and queries"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pvernier" }]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.4",
]
keywords = ["activityinfo", "api", "client", "monitoring-and-evaluation", "humanitarian"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/pvernier/activipyinfo"
Repository = "https://github.com/pvernier/activipyinfo"
Issues = "https://github.com/pvernier/activipyinfo/issues"
Changelog = "https://github.com/pvernier/activipyinfo/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pandas = [
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pandas-stubs>=2.2",
    "pytest>=9.0.2",
    "responses>=0.25",
    "ruff>=0.11",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "activipyinfo/__version__.py"

[tool.hatch.build.targets.sdist]
include = [
    "activipyinfo",
    "tests",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: calls the live ActivityInfo API (needs ACTIVITYINFO_TOKEN)",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["activipyinfo"]
check_untyped_defs = true
warn_unused_ignores = true
