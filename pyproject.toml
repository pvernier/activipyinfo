[project]
name = "activipyinfo"
dynamic = ["version"]
description = "Python client for the ActivityInfo API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.4",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/pvernier/activipyinfo"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=9.0.2",
    "responses>=0.25",
    "ruff>=0.11",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "activipyinfo/__version__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: calls the live ActivityInfo API (needs ACTIVITYINFO_TOKEN)",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["activipyinfo"]
check_untyped_defs = true
warn_unused_ignores = true
